services:
  waha:
    image: devlikeapro/waha
    ports:
      - "3000:3000"
    environment:
      - WHATSAPP_HOOK_URL=http://wapy:8000/webhook
      - WHATSAPP_HOOK_EVENTS=message
    volumes:
      - ./waha_sessions:/app/.sessions

  wapy:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - WAHA_BASE_URL=http://waha:3000
    volumes:
      - ./wapy.db:/app/wapy.db
      - ./credentials.json:/app/credentials.json:ro
    depends_on:
      - waha
