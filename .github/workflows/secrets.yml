# Filet de securite cote serveur : le hook de pre-commit est local et opt-in
# (core.hooksPath par clone), donc il ne protege que ceux qui l'ont active.
# Ce job, lui, s'execute sur tout ce qui arrive sur le depot.
#
# Limite assumee : on scanne l'arbre tel qu'il est pousse. Un secret introduit
# puis retire dans un commit ulterieur reste dans l'historique sans etre signale
# ici — le seul remede a ce stade est la rotation de la clef, pas un scan.
name: Secrets

on:
  push:
  pull_request:

jobs:
  scan:
    name: Barrage anti-secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scanner les fichiers suivis
        run: bash tools/scan-secrets.sh
