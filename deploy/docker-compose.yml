services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wapy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wapy
    volumes:
      - pgdata:/var/lib/postgresql/data

  waha:
    image: devlikeapro/waha
    restart: unless-stopped
    environment:
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY}
    volumes:
      - ./waha_sessions:/app/.sessions

  # Instance WAHA dédiée au pont développeurs. Séparée de celle des assistants,
  # et pas seulement par principe : un développeur qui pousse du volume ne doit
  # pas pouvoir dégrader le bot d'un client qui paie, et un incident sur l'un des
  # deux (mémoire, session corrompue, redémarrage) ne doit pas toucher l'autre.
  # Sessions et volumes distincts : aucun état partagé.
  waha-pont:
    image: devlikeapro/waha
    restart: unless-stopped
    environment:
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WHATSAPP_API_KEY=${WHATSAPP_PONT_API_KEY:-${WHATSAPP_API_KEY}}
    volumes:
      - ./waha_pont_sessions:/app/.sessions

  api:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      - DATABASE_URL=postgresql://wapy:${POSTGRES_PASSWORD}@postgres:5432/wapy
      - JWT_SECRET=${JWT_SECRET}
      - WAHA_BASE_URL=http://waha:3000
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY}
      # Pont développeurs : instance WAHA distincte, clé distincte.
      - WAHA_PONT_BASE_URL=http://waha-pont:3000
      - WHATSAPP_PONT_API_KEY=${WHATSAPP_PONT_API_KEY:-${WHATSAPP_API_KEY}}
      - WAPY_PONT_HMAC_KEY=${WAPY_PONT_HMAC_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-admin@wapy.io}
      - GENIUSPAY_API_KEY=${GENIUSPAY_API_KEY:-}
      - GENIUSPAY_API_SECRET=${GENIUSPAY_API_SECRET:-}
      - GENIUSPAY_WEBHOOK_SECRET=${GENIUSPAY_WEBHOOK_SECRET:-}
      - GENIUSPAY_BASE_URL=${GENIUSPAY_BASE_URL:-https://geniuspay.ci/api/v1/merchant}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - WAPY_FERNET_KEY=${WAPY_FERNET_KEY:-}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-}
      - RECAPTCHA_SECRET=${RECAPTCHA_SECRET:-}
      # Domaine de production. Il sert aussi à construire le redirect_uri OAuth
      # Google (`/api/google/callback`) : toute autre valeur doit être enregistrée
      # dans le client OAuth, sinon la connexion Agenda échoue en redirect_uri_mismatch.
      - PUBLIC_URL=${PUBLIC_URL:-https://wapy.pro}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - TRANSCRIBE_API_KEY=${TRANSCRIBE_API_KEY:-}
      - TRANSCRIBE_BASE_URL=${TRANSCRIBE_BASE_URL:-https://api.groq.com/openai/v1}
      - TRANSCRIBE_MODEL=${TRANSCRIBE_MODEL:-whisper-large-v3-turbo}
      - WEBHOOK_URL=http://api:8000/webhook
      - MEDIA_INTERNAL_BASE=http://api:8000
      - MEDIA_DIR=/app/media
    volumes:
      - media:/app/media
    depends_on:
      - postgres
      - waha

  web:
    restart: unless-stopped
    build:
      context: ../web
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    depends_on:
      - api

  # Reverse-proxy interne. Sur ce serveur (Plesk détient 80/443), Caddy est exposé
  # uniquement sur loopback:8080 ; nginx (Plesk) termine l'HTTPS et proxy vers 8080.
  # Cf. deploy/https-nginx.md pour la config nginx + certificat.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  media:
